<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./img/avatar.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d47a1">
  <title>Đăng nhập | NEWS 24H</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <link rel="stylesheet" href="./css/style1.css">
  <link rel="stylesheet" href="./css/bootstrap-news-theme.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-page">
  <main class="box auth-box">
    <a class="brand-mark" href="./index.html" aria-label="NEWS 24H">NEWS<span>24H</span></a>
    <div class="profile"><img src="./img/avatar.png" alt="Logo NEWS 24H" class="avatar"></div>
    <section id="login-section">
      <h2>Chào mừng trở lại</h2>
      <p class="auth-subtitle">Đăng nhập để tiếp tục đọc tin.</p>
      <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required class="form-control">
        <label for="login-password">Mật khẩu</label>
        <div class="password-wrap">
          <input id="login-password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required class="form-control">
          <button class="toggle-password" type="button" data-target="login-password" aria-label="Hiện mật khẩu" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <button id="login-btn" class="primary-btn btn btn-primary" type="submit">Đăng nhập</button>
      </form>
      <p class="auth-forgot-link"><a href="#forgot-password" id="forgot-password-toggle" aria-controls="forgot-password-panel" aria-expanded="false">Quên mật khẩu?</a></p>
      <section id="forgot-password-panel" class="forgot-password-panel" hidden>
        <h3>Khôi phục mật khẩu</h3>
        <p>Nhập email đã đăng ký. Firebase sẽ gửi cho bạn liên kết tạo mật khẩu mới.</p>
        <form id="forgot-password-form">
          <label for="forgot-email">Email nhận liên kết</label>
          <input id="forgot-email" name="forgot-email" type="email" placeholder="name@example.com" autocomplete="email" required class="form-control">
          <button id="forgot-password-btn" class="btn btn-outline-primary" type="submit">Gửi liên kết đặt lại</button>
        </form>
      </section>
      <div class="divider"><span>Hoặc tiếp tục với</span></div>
      <button id="google-login-btn" type="button" class="btn-google btn btn-outline-primary"><img class="google-icon" src="./img/google-g.svg" alt="">Tiếp tục bằng Google</button>
      <p class="auth-foot">Chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a></p>
    </section>
    <section id="profile-section" class="hidden">
      <h2>Đăng nhập thành công</h2>
      <p>Email: <strong id="profile-email">-</strong></p>
      <p>Đăng nhập lúc: <span id="profile-last-login">-</span></p>
      <button id="logout-btn" type="button" class="primary-btn btn btn-primary">Đăng xuất</button>
      <a class="home-link" href="./index.html">Đi tới trang chủ</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="./js/script.js"></script>
  <script type="module" src="./js/chatbot.js"></script>
</body>
</html>
